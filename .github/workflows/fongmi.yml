name: fongmiboxtv Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Inject signing & keystore
        run: |
          cat > app/signing.gradle << 'EOF'
          if (project.hasProperty('FONGMIBOX_STORE_FILE')) {
              signingConfigs {
                  myConfig {
                      storeFile file(FONGMIBOX_STORE_FILE)
                      storePassword FONGMIBOX_STORE_PASSWORD
                      keyAlias FONGMIBOX_KEY_ALIAS
                      keyPassword FONGMIBOX_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                      enableV3Signing = true
                      enableV4Signing = true
                  }
              }
          }
          EOF

          sed -i '1i apply from: "signing.gradle"' app/build.gradle
          sed -i '/debug {/a\            signingConfig signingConfigs.myConfig' app/build.gradle
          sed -i '/fongmibox {/a\            signingConfig signingConfigs.myConfig' app/build.gradle

          cp $GITHUB_WORKSPACE/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks

          {
            echo "FONGMIBOX_STORE_FILE=./TVBoxOSC.jks"
            echo "FONGMIBOX_KEY_ALIAS=TVBoxOSC"
            echo "FONGMIBOX_STORE_PASSWORD=TVBoxOSC"
            echo "FONGMIBOX_KEY_PASSWORD=TVBoxOSC"
          } >> gradle.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --parallel --daemon --warning-mode=fail

      - name: Collect APK
        run: |
          mkdir -p apk
          find . -path "*/build/outputs/apk/*" -name "*.apk" -exec mv {} apk/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.fongmibox
          path: apk/*
