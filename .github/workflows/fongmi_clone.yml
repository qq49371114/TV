name: Sync Fongmi Branch

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨3点
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出我们自己的 fongmi 分支
      - name: Checkout Fongmi Branch
        uses: actions/checkout@v4
        with:
          ref: fongmi # ✨ 目标分支：fongmi
          token: ${{ secrets.ACTION_TOKEN }}
          fetch-depth: 0

      # 2. 删除旧的工作流记录
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      # 3. 设置 Git 身份
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 添加上游仓库
      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/FongMi/TV.git

      # 5. 拉取上游的所有分支
      - name: Fetch Upstream
        run: git fetch upstream

      # 6. ✨ 核心操作：把上游的 fongmi 分支，强制覆盖到我们当前的 fongmi 分支！
      - name: Reset to Upstream Fongmi
        run: git reset --hard upstream/fongmi 

      # 7. 强制推送到我们自己的仓库
      - name: Force Push
        run: git push origin fongmi --force
