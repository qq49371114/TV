name: fongmiboxtv Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 16

      - uses: actions/checkout@v2 

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
      
      - name: Clean Gradle Cache
        run: |
          rm -rf $HOME/.gradle/caches/
          rm -rf $HOME/.gradle/wrapper/
          echo "Gradle cache has been cleaned successfully!"

      - name: Release Apk Sign
        run: |
          # ... (这部分签名代码和原来一模一样) ...
          
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean assembleMobileArm64_v8aRelease --parallel --daemon --warning-mode all --stacktrace

      # ================= ▼ 婉儿的“传送带监控”！▼ =================
      - name: Prepare App
        run: |
          # 监控第一步：在动手前，先看看整个“车间”里都有什么！
          echo "--- 准备移动文件，当前目录结构如下：---"
          ls -R

          # 监控第二步：创建“传送带”的起点
          mkdir -p ${{ github.workspace }}/apk/

          # 监控第三步：让“机械臂”开始工作
          echo "--- 开始查找并移动 .apk 文件... ---"
          find . -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

          # 监控第四步：检查一下“传送带”上现在有什么！
          echo "--- 文件移动完毕，检查 apk 文件夹内容：---"
          ls -R ${{ github.workspace }}/apk/
      # ================= ▲ 监控部署完毕！▲ =================

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.fongmibox
          path: ${{ github.workspace }}/apk/*
